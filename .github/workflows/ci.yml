name: SRE Website Quality Assurance & Release CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint, Test, and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Unit Tests
        run: |
          # Only run tests if any test files exist to avoid failing on sparse checkouts or workspace layout differences
          if compgen -G "src/**/*.test.ts" > /dev/null; then
            npm run test
          else
            echo "No test files found; skipping tests."
          fi

      - name: Audit Production Dependencies
        run: npm audit --omit=dev

      - name: Production Build
        run: npm run build
